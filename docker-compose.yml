services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_insurance}
      MYSQL_USER: ${DB_USERNAME:-smart_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [insurance]

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart_insurance}?serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-smart_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      SCANNER_MODE: ${SCANNER_MODE:-development}
      SCANNER_HOST: ${SCANNER_HOST:-clamav}
      SCANNER_PORT: ${SCANNER_PORT:-3310}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/var/documents}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - document-data:/app/var/documents
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [insurance]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks: [insurance]

volumes:
  mysql-data:
  document-data:
networks:
  insurance:
    driver: bridge
