spring:
  application:
    name: smart-insurance-api
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${MAX_REQUEST_SIZE_MB:11}MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_insurance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:smart_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sla:
    default-days: ${DEFAULT_SLA_DAYS:10}
  storage:
    mode: ${STORAGE_MODE:local}
    local-path: ${LOCAL_STORAGE_PATH:./var/documents}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:10}
    max-documents-per-claim: ${MAX_DOCUMENTS_PER_CLAIM:10}
  scanner:
    mode: ${SCANNER_MODE:development}
  email:
    mode: ${EMAIL_MODE:log}
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId}]"
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  jwt:
    secret: ${JWT_SECRET}
  pii:
    encryption-key: ${PII_ENCRYPTION_KEY}
  scanner:
    mode: ${SCANNER_MODE:clamav}
